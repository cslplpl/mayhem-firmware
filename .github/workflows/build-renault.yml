name: Build (TPMS Renault)

on:
  workflow_dispatch:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-renault.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init submodules (recursive)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive

      - name: Install toolchain & build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            cmake \
            ninja-build \
            python3

      - name: Configure (CMake, Release)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Package artifacts
        if: always()
        run: |
          mkdir -p artifacts
          shopt -s globstar nullglob
          cp -v build/**/*.bin artifacts/ || true
          cp -v build/**/*.ppfw artifacts/ || true
          if [ -d sdcard ]; then
            tar -C sdcard -czf artifacts/sdcard.tgz .
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mayhem-renault-firmware
          path: artifacts/**
          if-no-files-found: warn
