name: Build (TPMS Renault)

on:
  workflow_dispatch:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-renault.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init submodules (recursive)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 curl tar xz-utils bzip2 dfu-util

      # Arm GNU Toolchain 9-2019-q4-major (gcc 9.2.1)
      - name: Install Arm GNU Toolchain 9-2019-q4-major
        run: |
          set -e
          TOOLCHAIN_URL="https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2019q4/gcc-arm-none-eabi-9-2019-q4-major-x86_64-linux.tar.bz2"
          mkdir -p "$HOME/arm-gcc"
          curl -L "$TOOLCHAIN_URL" -o "$HOME/arm-gcc/toolchain.tar.bz2"
          tar -xf "$HOME/arm-gcc/toolchain.tar.bz2" -C "$HOME/arm-gcc" --strip-components=1
          echo "$HOME/arm-gcc/bin" >> "$GITHUB_PATH"
          "$HOME/arm-gcc/bin/arm-none-eabi-gcc" --version

      - name: Configure (CMake, MinSizeRel)
        env:
          CC:  ${{ env.HOME }}/arm-gcc/bin/arm-none-eabi-gcc
          CXX: ${{ env.HOME }}/arm-gcc/bin/arm-none-eabi-g++
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_FLAGS_MINSIZEREL="-Os -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS_MINSIZEREL="-Os -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections"

      # ⬇️ Kluczowa zmiana: budujemy WYŁĄCZNIE application.elf (bez basebandów)
      - name: Build (application only)
        run: |
          cmake --build build --target application.elf -j
          # Upewnij się, że powstał .bin (czasem jest generowany automatycznie, ale na wszelki wypadek…)
          if [ ! -f build/firmware/application/application.bin ]; then
            "$HOME/arm-gcc/bin/arm-none-eabi-objcopy" -Obinary \
              build/firmware/application/application.elf \
              build/firmware/application/application.bin
          fi

      - name: Package artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Zbierz tylko to, czego potrzebujesz do flashowania PortaPacka:
          find build/firmware/application -type f \( -name "application.elf" -o -name "application.bin
